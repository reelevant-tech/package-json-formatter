name: Release

on:
  push:
    tags:
    - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
    - name: Clone repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Detect Go version
      id: vars
      run: echo "go_version=$(grep '^go ' go.mod | awk '{print $2}')" >> "$GITHUB_OUTPUT"

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ steps.vars.outputs.go_version }}

    - name: Generate token
      uses: actions/create-github-app-token@v3
      id: app-token
      with:
        app-id: ${{ secrets.DEPLOY_APP_ID }}
        private-key: ${{ secrets.DEPLOY_APP_KEY }}

    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@v6
      with:
        version: "~> v2"
        args: release --clean
      env:
        GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  brew-update:
    name: Update Brew registry
    runs-on: ubuntu-latest
    needs: [release]
    steps:
    - name: Update Brew formula
      uses: mislav/bump-homebrew-formula-action@v4
      with:
        commit-message: "feat({{formulaName}}): publish version {{version}}"
        formula-path: pjf.rb
        homebrew-tap: Tchoupinax/homebrew-brew
      env:
        COMMITTER_TOKEN: ${{ secrets.BREW_COMITTER_PAT }}
